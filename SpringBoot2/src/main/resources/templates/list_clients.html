<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>List of Clients</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center">List of Clients</h2>
    <a href="/clients/add" class="btn btn-primary mb-3">Add Client</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="client : ${listClients}">
            <td th:text="${client.name}">Name</td>
            <td th:text="${client.email}">Email</td>
            <td th:text="${client.phone}">Phone</td>
            <td th:text="${client.address}">Address</td>
            <td>
                <a th:href="@{/clients/update/{id}(id=${client.id})}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{/clients/delete/{id}(id=${client.id})}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
