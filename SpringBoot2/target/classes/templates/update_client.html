<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Client</title>
</head>
<body>
    <h2 class="text-center">Update Client</h2>
    <form th:action="@{/clients/save}" th:object="${client}" method="post">
        <input type="hidden" th:field="*{id}" />
        Name: <input type="text" th:field="*{name}" /><br/>
        Email: <input type="text" th:field="*{email}" /><br/>
        Phone: <input type="text" th:field="*{phone}" /><br/>
        Address: <input type="text" th:field="*{address}" /><br/>
        <input type="submit" value="Update">
    </form>
</body>
</html>
