<!DOCTYPE html>
<html>
<head><title>Select Product</title></head>
<body>
    <h2>Select a Product</h2>
    <form action="productServlet" method="post">
        <label>Product:</label>
        <select name="pname">
            <option value="Pen">Pen - ₹10</option>
            <option value="Book">Book - ₹50</option>
            <option value="Bag">Bag - ₹300</option>
        </select><br><br>

        <label>Price:</label>
        <select name="price">
            <option value="10">10</option>
            <option value="50">50</option>
            <option value="300">300</option>
        </select><br><br>

        <input type="submit" value="Next">
    </form>
</body>
</html>
