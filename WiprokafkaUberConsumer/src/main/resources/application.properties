spring.application.name=WiprokafkaUberConsumer
server.port=8082

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
#spring.kafka.consumer.group-id=uber_ride_group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/wipro
spring.datasource.username=root
spring.datasource.password=akhilapatel25
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true

# Kafka topic name
kafka.topic.name=uber-ride-topic
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=uber-ride-group





